# 4-channel core baseline (see conversation/notes: this is the reduced set
# that carries most of the performance per the original ablation plan --
# 15m residual relief, openness, flow-orthogonality, SAVI anomaly). Same
# stack.tif as the 12-channel config; this just selects a subset of its bands.
data:
  stack_path: data/processed/features/altarvalley/stack.tif
  mask_path: data/processed/masks/altarvalley_combined_buf5m/AltarValleyMerged_mask.tif
  norm_stats_path: data/processed/features/altarvalley/norm_stats.json
  channels:
    - resid15
    - openness
    - omega
    - savi_anomaly
  patch_size: 256
  val_split: 0.2
  samples_per_epoch: 2000
  val_samples_per_epoch: 400
  pos_fraction: 0.5

model:
  encoder: resnet34
  # No raw R/G/B in this channel set -- train.py ignores this and trains
  # from random init regardless of what's set here.
  encoder_weights: imagenet
  num_classes: 1

training:
  epochs: 50
  batch_size: 8
  lr: 1.0e-4
  loss: bce_dice
  optimizer: adamw
  weight_decay: 1.0e-4

output:
  checkpoint_dir: outputs/checkpoints/altarvalley_core4
